<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vídeo de projeto</title>
<style>
@font-face { font-family: "DM Sans"; src: url("../../fonts/DMSans.woff2") format("woff2"); font-weight: 100 1000; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #10161c; font-family: "DM Sans", sans-serif; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #10161c; }
.seg { position: absolute; left: 0; top: 0; width: 1920px; height: 930px; overflow: hidden; opacity: 0; display: none; }
.seg.light { background: #eef1f4; color: #111a22; }
.cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
.cam img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; display: block; }
.hl { position: absolute; border: 6px solid #b6f25a; border-radius: 8px; box-shadow: 0 0 0 3px rgba(0,0,0,.55), 0 0 28px rgba(182,242,90,.35); opacity: 0; }
.hl.amber { border-color: #f2b84b; box-shadow: 0 0 0 3px rgba(0,0,0,.55), 0 0 28px rgba(242,184,75,.35); }
.hl.blue { border-color: #0a5ca8; box-shadow: 0 0 0 3px rgba(255,255,255,.9), 0 0 24px rgba(10,92,168,.35); }
#caption { position: absolute; left: 0; top: 930px; width: 1920px; height: 150px; background: #10161c; border-top: 2px solid #2f3b47; display: flex; align-items: center; justify-content: space-between; padding: 0 96px; gap: 48px; }
#cap-text { color: #f2f5f8; font-size: 44px; line-height: 1.22; font-weight: 560; letter-spacing: -0.005em; max-width: 1450px; text-wrap: balance; }
#cap-count { color: #f2b84b; font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; opacity: 0; white-space: nowrap; }
#cap-count small { display: block; font-size: 24px; font-weight: 500; color: #a6b3bf; }
.pad { position: absolute; inset: 0; padding: 70px 140px 0; }
.tag { font-size: 34px; color: #475663; margin-bottom: 26px; opacity: 0; }
.big { font-size: 112px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.02; }
.sub { font-size: 44px; color: #475663; margin-top: 20px; max-width: 1500px; line-height: 1.2; }
.rule { height: 4px; background: #111a22; width: 0; margin-top: 56px; }
.prob { margin-top: 40px; font-size: 58px; line-height: 1.18; font-weight: 560; letter-spacing: -0.015em; max-width: 1500px; min-height: 140px; }
.note { margin-top: 40px; font-size: 34px; color: #475663; opacity: 0; }
.cols { display: grid; grid-template-columns: 840px 1fr; gap: 70px; align-items: start; }
.counter { opacity: 0; margin-bottom: 34px; }
.counter .n { font-size: 124px; font-weight: 680; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
.counter .l { font-size: 33px; color: #475663; margin-top: 8px; line-height: 1.2; }
.meth { opacity: 0; font-size: 37px; line-height: 1.25; padding: 14px 0; border-bottom: 2px solid #c3ccd5; }
.meth b { font-weight: 640; }
.lim { margin-top: 30px; opacity: 0; border-left: 10px solid #7d4300; background: #f5e8d3; padding: 20px 30px; font-size: 34px; line-height: 1.26; max-width: 1640px; }
.legend { display: flex; gap: 36px; font-size: 30px; color: #475663; margin-bottom: 18px; opacity: 0; }
.legend i { display: inline-block; width: 26px; height: 26px; border-radius: 4px; margin-right: 10px; vertical-align: -4px; }
.row { display: grid; grid-template-columns: 560px 700px 1fr; gap: 36px; align-items: center; padding: 14px 0; border-bottom: 2px solid #c3ccd5; opacity: 0; }
.row .lab { font-size: 36px; font-weight: 600; line-height: 1.15; }
.track { display: grid; gap: 8px; }
.bar { height: 30px; background: #dde3e9; border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; width: 0; border-radius: 3px; }
.txts { font-size: 30px; color: #475663; font-variant-numeric: tabular-nums; line-height: 1.2; }
.txts div { height: 38px; display: flex; align-items: center; white-space: nowrap; }
.single .bar { height: 38px; }
.single .txts div { height: 38px; }
.lk { opacity: 0; margin-top: 34px; font-size: 68px; font-weight: 640; letter-spacing: -0.02em; }
.lk small { display: block; font-size: 30px; font-weight: 500; color: #475663; margin-bottom: 4px; letter-spacing: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="segs"></div>
  <div id="caption"><div id="cap-text"></div><div id="cap-count"></div></div>
</div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeO = (t) => 1 - Math.pow(1 - t, 3);
const lerp = (a, b, x) => a + (b - a) * x;
const fmt = (n) => Math.round(n).toLocaleString("pt-BR");
const VW = 1920, VH = 930;
const fadeWin = (t, a, b, f = 0.35) => clamp(Math.min((t - a) / f, (b - t) / f));
const reveal = (el, lt, t0, d = 0.45) => { const k = easeO(clamp((lt - t0) / d)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 14}px)`; return k; };

function camAt(keys, t) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]) { const x = easeIO(clamp((t - a[0]) / (b[0] - a[0]))); return [lerp(a[1], b[1], x), lerp(a[2], b[2], x), lerp(a[3], b[3], x)]; }
  }
  return keys[keys.length - 1].slice(1);
}

const SEG = [];
function build(cfg) {
  let start = 0;
  const host = document.getElementById("segs");
  for (const s of cfg.segments) {
    const el = document.createElement("section");
    el.className = "seg" + (s.type === "shot" ? "" : " light");
    s.el = el; s.start = start; start += s.dur; host.appendChild(el);
    const h = (html) => (el.innerHTML = html);
    if (s.type === "title") {
      h(`<div class="pad"><div class="big" id="a"></div><div class="sub" id="b"></div><div class="rule" id="c"></div><div class="prob" id="d"></div><div class="note" id="e"></div></div>`);
      el.querySelector("#a").textContent = s.name; el.querySelector("#b").textContent = s.sub; el.querySelector("#e").textContent = s.note || "";
    } else if (s.type === "stats") {
      h(`<div class="pad"><div class="tag" id="tag"></div><div class="cols"><div id="cl"></div><div id="cr"></div></div><div class="lim" id="lim"></div></div>`);
      el.querySelector("#tag").textContent = s.tag || "";
      const cl = el.querySelector("#cl"), cr = el.querySelector("#cr");
      s.cEls = (s.counters || []).map((c) => { const d = document.createElement("div"); d.className = "counter"; d.innerHTML = `<div class="n"></div><div class="l"></div>`; d.querySelector(".l").textContent = c.label; cl.appendChild(d); return d; });
      s.mEls = (s.meth || []).map((m) => { const d = document.createElement("div"); d.className = "meth"; d.innerHTML = m; cr.appendChild(d); return d; });
      if (!(s.counters || []).length) el.querySelector(".cols").style.gridTemplateColumns = "1fr";
      el.querySelector("#lim").innerHTML = s.lim ? `<b>Limites:</b> ${s.lim}` : "";
      if (!s.lim) el.querySelector("#lim").style.display = "none";
    } else if (s.type === "bars") {
      h(`<div class="pad"><div class="tag" id="tag"></div><div class="legend" id="lg"></div><div id="rows"></div><div class="lim" id="lim"></div></div>`);
      el.querySelector("#tag").textContent = s.tag || "";
      el.querySelector("#lg").innerHTML = (s.legend || []).map((t, i) => `<span><i style="background:${i ? "#0a5ca8" : "#8a96a3"}"></i>${t}</span>`).join("");
      if (!(s.legend || []).length) el.querySelector("#lg").style.display = "none";
      const rows = el.querySelector("#rows");
      s.rEls = s.rows.map((r) => {
        const d = document.createElement("div"); d.className = "row" + (r.b ? "" : " single");
        const ser = r.b ? [r.a, r.b] : [r.a];
        d.innerHTML = `<div class="lab"></div><div class="track">${ser.map((x, i) => `<div class="bar"><div style="background:${r.b ? (i ? "#0a5ca8" : "#8a96a3") : "#0a5ca8"}"></div></div>`).join("")}</div><div class="txts">${ser.map((x) => `<div>${x.txt}</div>`).join("")}</div>`;
        d.querySelector(".lab").textContent = r.label; rows.appendChild(d); d._ser = ser; return d;
      });
      el.querySelector("#lim").innerHTML = s.lim ? `<b>Limites:</b> ${s.lim}` : "";
      if (!s.lim) el.querySelector("#lim").style.display = "none";
    } else if (s.type === "end") {
      h(`<div class="pad"><div class="big" id="a" style="font-size:76px;opacity:0"></div><div id="ls"></div><div class="note" id="e"></div></div>`);
      el.querySelector("#a").textContent = s.head;
      el.querySelector("#ls").innerHTML = s.links.map(([k, v]) => `<div class="lk"><small>${k}</small>${v}</div>`).join("");
      el.querySelector("#e").textContent = s.note || "";
    } else if (s.type === "shot") {
      h(`<div class="cam"></div>`);
      const cam = el.querySelector(".cam");
      s.imgEls = s.layers.map(([src]) => { const im = new Image(); im.src = src; cam.appendChild(im); return im; });
      s.hlEls = (s.hl || []).map(([, , x, y, w, hh, cls]) => { const d = document.createElement("div"); d.className = "hl " + (cls || ""); Object.assign(d.style, { left: x - 6 + "px", top: y - 6 + "px", width: w + 12 + "px", height: hh + 12 + "px", zIndex: 50 }); cam.appendChild(d); return d; });
      s.camEl = cam;
    }
  }
  window.TOTAL = start;
}

function setCaption(cues, lt) {
  const el = document.getElementById("cap-text"); let txt = "", op = 0;
  for (const [a, b, text, typed] of cues || []) if (lt >= a && lt < b) {
    op = typed ? clamp((lt - a) / 0.2) : fadeWin(lt, a, b, 0.3);
    txt = typed ? text.slice(0, Math.floor((lt - a) * 24)) : text;
  }
  el.textContent = txt; el.style.opacity = op;
}

function setT(t) {
  const S = CFG.segments.find((s) => t >= s.start && t < s.start + s.dur) || CFG.segments[CFG.segments.length - 1];
  const lt = t - S.start;
  for (const s of CFG.segments) { s.el.style.display = s === S ? "block" : "none"; }
  const inn = clamp(lt / 0.5), out = clamp((S.dur - lt) / 0.4);
  S.el.style.opacity = Math.min(easeO(inn), out);
  S.el.style.transform = `translateX(${(1 - easeO(inn)) * 50}px)`;
  setCaption(S.cap, lt);
  const cc = document.getElementById("cap-count"); cc.style.opacity = 0;

  if (S.type === "title") {
    const e = S.el, a = e.querySelector("#a");
    reveal(a, lt, 0.3, 0.8); reveal(e.querySelector("#b"), lt, 0.9, 0.7);
    e.querySelector("#c").style.width = 1640 * easeIO(clamp((lt - 1.6) / 1.0)) + "px";
    e.querySelector("#d").textContent = S.prob.slice(0, Math.floor(Math.max(0, lt - 2.4) * 17));
    reveal(e.querySelector("#e"), lt, S.dur - 2.2, 0.6);
  }
  if (S.type === "stats") {
    const e = S.el; reveal(e.querySelector("#tag"), lt, 0.2);
    S.cEls.forEach((d, i) => { const c = S.counters[i]; const t0 = 0.6 + i * 0.9; reveal(d, lt, t0, 0.5);
      d.querySelector(".n").textContent = c.fixed ? c.fixed : `${c.pre || ""}${Math.round(c.target * easeO(clamp((lt - t0) / 1.6)))} de ${c.total}`; });
    const m0 = 0.6 + S.cEls.length * 0.9 + 0.4;
    S.mEls.forEach((d, i) => reveal(d, lt, m0 + i * 1.2, 0.45));
    reveal(e.querySelector("#lim"), lt, m0 + S.mEls.length * 1.2 + 0.4, 0.5);
  }
  if (S.type === "bars") {
    const e = S.el; reveal(e.querySelector("#tag"), lt, 0.2); reveal(e.querySelector("#lg"), lt, 0.5);
    S.rEls.forEach((d, i) => { const t0 = 0.8 + i * 0.7; reveal(d, lt, t0, 0.4);
      d.querySelectorAll(".bar > div").forEach((b, j) => { b.style.width = d._ser[j].pct * easeO(clamp((lt - t0 - 0.2) / 1.0)) + "%"; }); });
    reveal(e.querySelector("#lim"), lt, 0.8 + S.rEls.length * 0.7 + 0.6, 0.5);
  }
  if (S.type === "end") {
    const e = S.el; reveal(e.querySelector("#a"), lt, 0.3, 0.7);
    e.querySelectorAll(".lk").forEach((d, i) => reveal(d, lt, 1.6 + i * 1.0, 0.6));
    reveal(e.querySelector("#e"), lt, 1.6 + S.links.length * 1.0 + 0.4, 0.6);
  }
  if (S.type === "shot") {
    const [cx, cy, sc] = camAt(S.cam, lt);
    let tx = clamp(VW / 2 - cx * sc, VW - 1920 * sc, 0), ty = clamp(VH / 2 - cy * sc, VH - 1080 * sc, 0);
    S.camEl.style.transform = `translate(${tx}px, ${ty}px) scale(${sc})`;
    S.layers.forEach(([, a], i) => { S.imgEls[i].style.opacity = lt >= a ? easeIO(i === 0 ? 1 : clamp((lt - a) / 0.8)) : 0; S.imgEls[i].style.zIndex = i; });
    (S.hl || []).forEach(([a, b], i) => { S.hlEls[i].style.opacity = fadeWin(lt, a, b, 0.35); });
    if (S.counter) { const [a, b, from, to, label, suffix] = S.counter;
      if (lt >= a && lt < b) { const n = lerp(from, to, easeIO(clamp((lt - a - 0.6) / 2.2))); cc.innerHTML = `${fmt(n)}${suffix}<small>${label}</small>`; cc.style.opacity = fadeWin(lt, a, b, 0.4); } }
  }
}
window.setT = setT;
window.load = async (slug) => {
  await new Promise((res, rej) => { const s = document.createElement("script"); s.src = `cfg/${slug}.js`; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  build(window.CFG);
  await document.fonts.ready; await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  return window.TOTAL;
};
</script>
</body>
</html>
